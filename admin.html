<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Admin Dashboard - CivicFix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav><a class="brand" href="index.html"><img src="civilfix-logo.png" alt="CivicFix" class="logo"></a>
        <div class="navlinks"><a href="index.html">Home</a>
            <a href="report.html">Report Issue</a>
            <a href="track.html">Track</a>
            <a href="issues.html">Public Issues</a>
            <a class="active" href="admin.html">Admin</a>
        </div>
    </nav>
    <main class="page">
        <div class="page-title"><span class="pill">ADMIN DEMO</span>
            <h1>Issue management dashboard</h1>
            <p>Review demo complaints and update their status.</p>
        </div>
        <div class="stats">
            <div><b id="total">0</b><span>Total</span></div>
            <div><b id="pending">0</b><span>Pending</span></div>
            <div><b id="progress">0</b><span>In Progress</span></div>
            <div><b id="resolved">0</b><span>Resolved</span></div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Issue</th>
                        <th>Location</th>
                        <th>Status</th>
                        <th>Update</th>
                    </tr>
                </thead>
                <tbody id="adminRows"></tbody>
            </table>
        </div>
    </main>
    <footer>© 2026 CivicFix · Educational demo</footer>
    <script src="script.js"></script>
</body>

</html>
